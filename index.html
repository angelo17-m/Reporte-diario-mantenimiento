<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Diario - Chuquicamata</title>
    <style>
        :root { --copper: #E05206; --bg: #000; --card: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; padding: 10px; margin: 0; }
        .container { max-width: 500px; margin: 10px auto; background: var(--card); border-radius: 12px; border-top: 5px solid var(--copper); padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        label { display: block; margin: 15px 0 5px; font-weight: bold; color: #ccc; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #252525; color: white; box-sizing: border-box; }
        .step { display: none; }
        .step.active { display: block; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-next { background: var(--copper); color: white; }
        .btn-submit { background: #28a745; color: white; width: 100%; margin-top: 20px; }
        .loader { display: none; text-align: center; color: var(--copper); margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:var(--copper);">Reporte Mantenimiento</h2>
    <form id="mainForm">
        <div class="step active" id="s1">
            <label>Nombre Responsable *</label>
            <input type="text" id="nombre" required>
            <label>N° OT</label>
            <input type="text" id="ot">
            <div class="btn-group"><button type="button" class="btn btn-next" onclick="move(2)">Siguiente</button></div>
        </div>

        <div class="step" id="s2">
            <label>Equipo</label>
            <select id="equipo">
                <option value="Carro norte (CT137)">Carro norte (CT137)</option>
                <option value="Carro sur (CT137 A)">Carro sur (CT137 A)</option>
                <option value="Harn15/F900-1">Harn15/F900-1</option>
                <option value="NODO 1">NODO 1</option>
                <option value="Housekeeping">Housekeeping</option>
            </select>
            <label>¿Terminado? *</label>
            <select id="terminado" onchange="document.getElementById('mDiv').style.display=(this.value=='Si'?'none':'block')">
                <option value="Si">Si</option><option value="No">No</option><option value="En curso">En curso</option>
            </select>
            <div id="mDiv" style="display:none;"><label>Motivo</label><textarea id="motivoText"></textarea></div>
            <div class="btn-group">
                <button type="button" class="btn" style="background:#444; color:white;" onclick="move(1)">Atrás</button>
                <button type="button" class="btn btn-next" onclick="move(3)">Siguiente (Fotos)</button>
            </div>
        </div>

        <div class="step" id="s3">
            <label>Foto Actividad</label><input type="file" id="fAct" accept="image/*">
            <label>Foto ART</label><input type="file" id="fART" accept="image/*">
            <button type="submit" id="btnSubmit" class="btn btn-submit">ENVIAR A EXCEL</button>
            <div id="loader" class="loader">Enviando... por favor espera.</div>
        </div>
    </form>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_pTj-Fvk3SYJRCSGSxStejCg8XarO3Cj7mVfXhyetWsbCZk48YF4uFhlhpPuYIgjV/exec";

    function move(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('s' + n).classList.add('active');
    }

    async function toB64(file) {
        return new Promise((res) => {
            if (!file) return res("");
            const r = new FileReader();
            r.onload = () => res(r.result);
            r.readAsDataURL(file);
        });
    }

    document.getElementById('mainForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const ldr = document.getElementById('loader');
        btn.disabled = true; ldr.style.display = 'block';

        const payload = {
            nombre: document.getElementById('nombre').value,
            ot: document.getElementById('ot').value,
            equipo: document.getElementById('equipo').value,
            terminado: document.getElementById('terminado').value,
            motivoNoTerminado: document.getElementById('motivoText').value,
            fotoActividad: await toB64(document.getElementById('fAct').files[0]),
            fotoART: await toB64(document.getElementById('fART').files[0])
        };

        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
        .then(() => { alert("Enviado con éxito"); location.reload(); })
        .catch(() => { alert("Error"); btn.disabled = false; ldr.style.display = 'none'; });
    });
</script>
</body>
</html>
