<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Diario - Codelco</title>
    <style>
        :root { --blue: #002855; --copper: #E05206; --bg: #000000; --card: #1a1a1a; --text: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; }
        
        .container { width: 100%; max-width: 500px; background: var(--card); border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 6px solid var(--copper); margin-top: 10px; }
        
        .header { background: #fdfdfd; padding: 15px; text-align: center; }
        .header img { max-width: 250px; }
        
        .form-content { padding: 30px; }
        h2 { text-align: center; font-size: 1.6rem; margin: 0; letter-spacing: 1px; }
        p.subtitle { text-align: center; color: #888; font-size: 0.9rem; margin: 5px 0 25px; }
        
        /* Sistema de Pasos */
        .step { display: none; }
        .step.active { display: block; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        label { display: block; margin: 20px 0 10px; font-weight: bold; font-size: 0.95rem; color: #ddd; }
        
        input[type="text"], input[type="number"], select, textarea { 
            width: 100%; padding: 14px; border: 1px solid #333; border-radius: 8px; 
            background: #252525; color: white; font-size: 1rem; box-sizing: border-box; outline: none;
        }
        input:focus, select:focus { border-color: var(--copper); }

        /* Botones estilo Video */
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .btn { flex: 1; padding: 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn-next { background: var(--copper); color: white; }
        .btn-prev { background: #444; color: white; }
        .btn-submit { background: #28a745; color: white; }
        .btn:active { transform: scale(0.98); }

        /* Inputs de Fotos */
        .file-upload { border: 2px dashed #444; padding: 25px; text-align: center; border-radius: 10px; background: #222; cursor: pointer; margin-bottom: 10px; }
        .file-upload:hover { border-color: var(--copper); }
        
        .loader { display: none; text-align: center; color: var(--copper); font-weight: bold; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://i.ibb.co/v4S8L8T/codelco-banner.png" alt="Logo Proyectos">
    </div>

    <div class="form-content">
        <h2>REPORTE DIARIO</h2>
        <p class="subtitle">Reporte Rápido Post Mantenimiento</p>

        <form id="jotFormLike">
            
            <div class="step active" id="step1">
                <label>Nombre *</label>
                <input type="text" id="nombre" required placeholder="Nombre y Apellido">
                <label>N° OT</label>
                <input type="text" id="ot" placeholder="Ej: 1098XXX">
                <label>Cargo oficial</label>
                <input type="text" id="cargo">
                <div class="btn-group">
                    <button type="button" class="btn btn-next" onclick="changeStep(2)">Siguiente</button>
                </div>
            </div>

            <div class="step" id="step2">
                <label>¿De qué empresa eres?</label>
                <select id="empresa">
                    <option value="Codelco">Codelco</option>
                    <option value="Metso">Metso</option>
                    <option value="SFK">SFK</option>
                    <option value="Nexxo">Nexxo</option>
                    <option value="Schwager">Schwager</option>
                    <option value="Cimap">Cimap</option>
                </select>
                <div class="btn-group">
                    <button type="button" class="btn btn-prev" onclick="changeStep(1)">Atrás</button>
                    <button type="button" class="btn btn-next" onclick="changeStep(3)">Siguiente</button>
                </div>
            </div>

            <div class="step" id="step3">
                <label>¿En qué equipo trabajaste?</label>
                <select id="equipo">
                    <option value="">Seleccione equipo...</option>
                    <option value="Harn15/F900-1">Harn15/F900-1</option><option value="Harn25/F900-1">Harn25/F900-1</option>
                    <option value="F900-3">F900-3</option><option value="F900-3A">F900-3A</option>
                    <option value="Harn45/F900-4">Harn45/F900-4</option><option value="Harn5S/F900-5">Harn5S/F900-5</option>
                    <option value="HarnF600 1A">HarnF600 1A</option><option value="HarnF600 2A">HarnF600 2A</option>
                    <option value="HarnF600 3A">HarnF600 3A</option><option value="HarnF600 3B">HarnF600 3B</option>
                    <option value="ChaS1">ChaS1</option><option value="ChaS2">ChaS2</option><option value="ChaS3">ChaS3</option>
                    <option value="ChaT1">ChaT1</option><option value="ChaT2">ChaT2</option><option value="NODO 1">NODO 1</option>
                    <option value="NODO 2">NODO 2</option><option value="C/135A">C/135A</option><option value="C/1A">C/1A</option>
                    <option value="Fabricación/Reparación estructuras">Fabricación/Reparación estructuras</option>
                    <option value="Housekeeping">Housekeeping</option>
                </select>
                <div class="btn-group">
                    <button type="button" class="btn btn-prev" onclick="changeStep(2)">Atrás</button>
                    <button type="button" class="btn btn-next" onclick="changeStep(4)">Siguiente</button>
                </div>
            </div>

            <div class="step" id="step4">
                <label>¿Ocupó repuestos?</label>
                <select id="ocupoRepuestos">
                    <option value="SI">SI</option>
                    <option value="NO" selected>NO</option>
                </select>
                <label>¿Qué repuestos ocupó?</label>
                <textarea id="queRepuestos" rows="3" placeholder="Detalle aquí..."></textarea>
                <div class="btn-group">
                    <button type="button" class="btn btn-prev" onclick="changeStep(3)">Atrás</button>
                    <button type="button" class="btn btn-next" onclick="changeStep(5)">Siguiente</button>
                </div>
            </div>

            <div class="step" id="step5">
                <label>¿Con cuántas personas se hizo el trabajo?</label>
                <select id="nPersonas">
                    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                    <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                    <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                    <option value="10">10</option>
                </select>
                <label>¿Cuántas horas demoró?</label>
                <select id="horas">
                    <option value="1hr">1hr</option><option value="2hrs">2hrs</option><option value="3hrs">3hrs</option>
                    <option value="4hrs">4hrs</option><option value="5hrs">5hrs</option><option value="6hrs">6hrs</option>
                    <option value="7hrs">7hrs</option><option value="8hrs">8hrs</option><option value="9hrs">9hrs</option>
                    <option value="10hrs">10hrs</option><option value="11hrs">11hrs</option><option value="12hrs">12hrs</option>
                </select>
                <div class="btn-group">
                    <button type="button" class="btn btn-prev" onclick="changeStep(4)">Atrás</button>
                    <button type="button" class="btn btn-next" onclick="changeStep(6)">Siguiente</button>
                </div>
            </div>

            <div class="step" id="step6">
                <label>¿Terminaste el trabajo completamente? *</label>
                <select id="terminado">
                    <option value="SI">SI</option>
                    <option value="NO">NO</option>
                    <option value="EN CURSO">EN CURSO</option>
                </select>

                <label>Foto Housekeeping</label>
                <input type="file" id="fotoHK" accept="image/*" capture="environment" class="file-upload">

                <label>Foto ART / Actividad</label>
                <input type="file" id="fotoART" accept="image/*" capture="environment" class="file-upload">

                <div class="btn-group">
                    <button type="button" class="btn btn-prev" onclick="changeStep(5)">Atrás</button>
                    <button type="submit" id="btnSubmit" class="btn btn-submit">ENVIAR</button>
                </div>
                <div id="loader" class="loader">Sincronizando con Excel... Espere.</div>
            </div>

        </form>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytUEWdpzuWAJF9IBa_K9c9W7Qrgk6-7m4AnXoYiCMmpXV8C0GDFrTsOPj1CwI5kUSzJg/exec";

    function changeStep(step) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step' + step).classList.add('active');
        window.scrollTo(0,0);
    }

    async function toB64(file) {
        return new Promise((res) => {
            if (!file) return res("");
            const r = new FileReader();
            r.onload = () => res(r.result);
            r.readAsDataURL(file);
        });
    }

    document.getElementById('jotFormLike').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const loader = document.getElementById('loader');
        
        btn.disabled = true;
        loader.style.display = 'block';

        const payload = {
            nombre: document.getElementById('nombre').value,
            ot: document.getElementById('ot').value,
            cargo: document.getElementById('cargo').value,
            empresa: document.getElementById('empresa').value,
            equipo: document.getElementById('equipo').value,
            ocupoRepuestos: document.getElementById('ocupoRepuestos').value,
            queRepuestos: document.getElementById('queRepuestos').value,
            nPersonas: document.getElementById('nPersonas').value,
            horas: document.getElementById('horas').value,
            terminado: document.getElementById('terminado').value,
            fotoHousekeeping: await toB64(document.getElementById('fotoHK').files[0]),
            fotoART: await toB64(document.getElementById('fotoART').files[0])
        };

        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
        .then(() => {
            alert("¡Reporte enviado exitosamente!");
            location.reload();
        }).catch(() => {
            alert("Error de conexión.");
            btn.disabled = false;
            loader.style.display = 'none';
        });
    });
</script>

</body>
</html>
