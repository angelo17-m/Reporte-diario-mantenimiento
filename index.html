<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Técnico Oficial</title>
    <style>
        :root { --blue: #0369a1; --bg: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); padding: 15px; display: flex; justify-content: center; }
        .form-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; border-top: 8px solid var(--blue); }
        h2 { color: var(--blue); text-align: center; margin-bottom: 25px; }
        h3 { border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; color: #475569; font-size: 1.1rem; margin-top: 25px; }
        label { display: block; margin: 12px 0 5px; font-weight: bold; color: #1e293b; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        input[type="file"] { padding: 8px; background: #f1f5f9; cursor: pointer; }
        button { width: 100%; padding: 15px; background: var(--blue); color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; margin-top: 30px; cursor: pointer; }
        button:disabled { background: #94a3b8; }
        .loader { display: none; text-align: center; color: var(--blue); font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Registro de Actividad Técnico</h2>
    <form id="otForm">
        <h3>1. Información Base</h3>
        <label>Nombre</label> <input type="text" id="nombre" required>
        <label>N° OT</label> <input type="text" id="ot" required>
        <label>Cargo oficial</label> <input type="text" id="cargo">
        <label>¿De qué empresa eres?</label> <input type="text" id="empresa" required>
        <label>¿En qué equipo trabajaste?</label> <input type="text" id="equipo" required>

        <h3>2. Recursos y Tiempos</h3>
        <label>¿Ocupó repuestos?</label>
        <select id="ocupoRepuestos"><option value="No">No</option><option value="Si">Si</option></select>
        <label>¿Qué repuestos ocupó?</label> <textarea id="queRepuestos" rows="2"></textarea>
        <label>¿Con cuántas personas se hizo el trabajo?</label> <input type="number" id="nPersonas">
        <label>¿Cuántas horas demoró?</label> <input type="number" step="0.5" id="horas">

        <h3>3. Planificación y Cierre</h3>
        <label>¿Trabajo planificado?</label>
        <select id="planificado"><option value="Si">Si</option><option value="No">No</option></select>
        <label>¿Terminaste el trabajo completamente?</label>
        <select id="terminado"><option value="Si">Si</option><option value="No">No</option></select>
        <label>Si no terminaste, ¿Por qué motivo?</label> <textarea id="motivoNoTerminado" rows="2"></textarea>

        <h3>4. Evidencia Fotográfica</h3>
        <p style="font-size: 0.85rem; color: #64748b;">Sube una foto o tómala con la cámara.</p>
        
        <label>Foto Housekeeping</label>
        <input type="file" id="fotoHousekeeping" accept="image/*" capture="environment">
        
        <label>Foto Registro Actividad</label>
        <input type="file" id="fotoActividad" accept="image/*" capture="environment">
        
        <label>Foto ART</label>
        <input type="file" id="fotoART" accept="image/*" capture="environment">
        
        <label>Foto Plan de Izaje (Si aplica)</label>
        <input type="file" id="fotoIzaje" accept="image/*" capture="environment">

        <button type="submit" id="btnEnviar">Enviar Reporte y Fotos</button>
        <div id="loadingText" class="loader">Procesando fotos y enviando, no cierre la página...</div>
    </form>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzR5FmtitWnq-7uMa8WVJnmSIUXukh74ihCgeTig9-ZSnu8i3JRg-c4FUOtIIzm8a6wpA/exec";

    // Función mágica para convertir la foto en texto (Base64) para poder enviarla
    function getBase64(file) {
        return new Promise((resolve, reject) => {
            if (!file) { resolve(""); return; }
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    document.getElementById('otForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        const loader = document.getElementById('loadingText');
        
        btn.disabled = true;
        btn.style.display = 'none';
        loader.style.display = 'block'; // Muestra un aviso de carga porque las fotos demoran un poco

        // Convertimos las fotos si es que subieron alguna
        const b64Housekeeping = await getBase64(document.getElementById('fotoHousekeeping').files[0]);
        const b64Actividad = await getBase64(document.getElementById('fotoActividad').files[0]);
        const b64ART = await getBase64(document.getElementById('fotoART').files[0]);
        const b64Izaje = await getBase64(document.getElementById('fotoIzaje').files[0]);

        const payload = {
            nombre: document.getElementById('nombre').value,
            ot: document.getElementById('ot').value,
            cargo: document.getElementById('cargo').value,
            empresa: document.getElementById('empresa').value,
            equipo: document.getElementById('equipo').value,
            ocupoRepuestos: document.getElementById('ocupoRepuestos').value,
            queRepuestos: document.getElementById('queRepuestos').value,
            nPersonas: document.getElementById('nPersonas').value,
            horas: document.getElementById('horas').value,
            planificado: document.getElementById('planificado').value,
            terminado: document.getElementById('terminado').value,
            motivoNoTerminado: document.getElementById('motivoNoTerminado').value,
            
            // Enviamos las fotos convertidas
            fotoHousekeeping: b64Housekeeping,
            fotoActividad: b64Actividad,
            fotoART: b64ART,
            fotoIzaje: b64Izaje
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(payload)
        }).then(() => {
            alert("¡Reporte guardado exitosamente!");
            document.getElementById('otForm').reset();
            btn.disabled = false;
            btn.style.display = 'block';
            loader.style.display = 'none';
        }).catch(err => {
            alert("Error al enviar: " + err);
            btn.disabled = false;
            btn.style.display = 'block';
            loader.style.display = 'none';
        });
    });
</script>
</body>
</html>
