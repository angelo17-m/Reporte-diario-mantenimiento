<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Diario - Codelco</title>
    <style>
        :root { --blue: #002855; --copper: #E05206; --bg: #000000; --card: #1a1a1a; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        
        .container { width: 100%; max-width: 500px; background: var(--card); border-radius: 15px; margin: 10px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 6px solid var(--copper); }
        
        /* Imagen de Portada */
        .header-img { width: 100%; display: block; }
        
        .form-content { padding: 25px; }
        h2 { text-align: center; font-size: 1.4rem; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { text-align: center; color: #888; font-size: 0.85rem; margin: 5px 0 20px; }
        
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        label { display: block; margin: 15px 0 8px; font-weight: bold; color: #ddd; font-size: 0.9rem; }
        input, select, textarea { 
            width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; 
            background: #252525; color: white; font-size: 1rem; box-sizing: border-box;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-next { background: var(--copper); color: white; }
        .btn-prev { background: #444; color: white; }
        .btn-submit { background: #28a745; color: white; width: 100%; margin-top: 20px; }
        
        .file-box { border: 2px dashed #444; padding: 20px; text-align: center; border-radius: 10px; background: #222; margin-bottom: 10px; cursor: pointer; }
        .loader { display: none; text-align: center; color: var(--copper); font-weight: bold; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://i.ibb.co/9H87Gz0/image-bb437d.png" alt="Portada Codelco" class="header-img">

    <div class="form-content">
        <h2>REPORTE DIARIO</h2>
        <p class="subtitle">Gestión de Mantenimiento Terreno</p>

        <form id="mainForm">
            <div class="step active" id="step1">
                <label>Nombre del Responsable *</label>
                <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">
                <label>N° OT</label>
                <input type="text" id="ot" placeholder="Número de orden">
                <label>Cargo oficial</label>
                <input type="text" id="cargo">
                <div class="btn-group"><button type="button" class="btn btn-next" onclick="go(2)">Siguiente</button></div>
            </div>

            <div class="step" id="step2">
                <label>¿De qué empresa eres?</label>
                <select id="empresa">
                    <option value="Codelco">Codelco</option>
                    <option value="Metso">Metso</option>
                    <option value="Nexxo">Nexxo</option>
                    <option value="SKF">SKF</option>
                    <option value="Schwager">Schwager</option>
                    <option value="Cimap">Cimap</option>
                </select>
                <div class="btn-group">
                    <button type="button" class="btn btn-prev" onclick="go(1)">Atrás</button>
                    <button type="button" class="btn btn-next" onclick="go(3)">Siguiente</button>
                </div>
            </div>

            <div class="step" id="step3">
                <label>¿En qué equipo trabajaste?</label>
                <select id="equipo">
                    <option value="">Seleccione equipo...</option>
                    <option value="Harn15/F900-1">Harn15/F900-1</option><option value="Harn25/F900-1">Harn25/F900-1</option>
                    <option value="F900-3">F900-3</option><option value="F900-3A">F900-3A</option>
                    <option value="Harn45/F900-4">Harn45/F900-4</option><option value="Harn5S/F900-5">Harn5S/F900-5</option>
                    <option value="HarnF600 1A">HarnF600 1A</option><option value="HarnF600 2A">HarnF600 2A</option>
                    <option value="HarnF600 3A">HarnF600 3A</option><option value="HarnF600 4A">HarnF600 4A</option>
                    <option value="HarnF600 5A">HarnF600 5A</option><option value="HarnF600 6A">HarnF600 6A</option>
                    <option value="HarnF600 7A">HarnF600 7A</option><option value="HarnF600 8A">HarnF600 8A</option>
                    <option value="HarnF600 9A">HarnF600 9A</option><option value="HarnF600 10A">HarnF600 10A</option>
                    <option value="HarnF600 3B">HarnF600 3B</option><option value="HarnF600 4B">HarnF600 4B</option>
                    <option value="HarnF600 5B">HarnF600 5B</option><option value="HarnF600 6B">HarnF600 6B</option>
                    <option value="HarnF600 7B">HarnF600 7B</option><option value="HarnF600 8B">HarnF600 8B</option>
                    <option value="HarnF600 9B">HarnF600 9B</option><option value="HarnF600 10B">HarnF600 10B</option>
                    <option value="ChaS1">ChaS1</option><option value="ChaS2">ChaS2</option><option value="ChaS3">ChaS3</option>
                    <option value="ChaS4">ChaS4</option><option value="ChaS5">ChaS5</option>
                    <option value="ChaT1">ChaT1</option><option value="ChaT2">ChaT2</option><option value="ChaT3">ChaT3</option>
                    <option value="ChaT4">ChaT4</option><option value="ChaT5">ChaT5</option><option value="ChaT6">ChaT6</option>
                    <option value="ChaT7">ChaT7</option><option value="ChaT8">ChaT8</option><option value="ChaT9">ChaT9</option>
                    <option value="ChaT10">ChaT10</option>
                    <option value="NODO 1">NODO 1</option><option value="NODO 2">NODO 2</option><option value="NODO 3">NODO 3</option>
                    <option value="C/135A">C/135A</option><option value="C/1A">C/1A</option><option value="C/2A">C/2A</option>
                    <option value="C/11A">C/11A</option><option value="C/22A">C/22A</option><option value="C/140A">C/140A</option>
                    <option value="C/141A">C/141A</option><option value="C/140">C/140</option><option value="C/141">C/141</option>
                    <option value="C/142">C/142</option><option value="C/136A">C/136A</option><option value="C/136B">C/136B</option>
                    <option value="C/136C">C/136C</option><option value="C/144">C/144</option><option value="C/137A">C/137A</option>
                    <option value="C/137">C/137</option><option value="C/135B">C/135B</option><option value="C/135C">C/135C</option>
                    <option value="C/135D">C/135D</option><option value="C/136">C/136</option><option value="C/138">C/138</option>
                    <option value="C/139">C/139</option><option value="C/143">C/143</option><option value="C/135E">C/135E</option>
                    <option value="C/134A">C/134A</option><option value="C/134B">C/134B</option><option value="C/134C">C/134C</option>
                    <option value="C/134D">C/134D</option><option value="C/134E">C/134E</option>
                    <option value="Fabricación/Reparación estructuras">Fabricación/Reparación estructuras</option>
                    <option value="Housekeeping">Housekeeping</option>
                </select>
                <div class="btn-group">
                    <button type="button" class="btn btn-prev" onclick="go(2)">Atrás</button>
                    <button type="button" class="btn btn-next" onclick="go(4)">Siguiente</button>
                </div>
            </div>

            <div class="step" id="step4">
                <label>¿Ocupó repuestos?</label>
                <select id="ocupoRep">
                    <option value="No">No</option>
                    <option value="Si">Si</option>
                </select>
                <label>¿Qué repuestos ocupó?</label>
                <textarea id="queRep" rows="2"></textarea>
                <div class="btn-group">
                    <button type="button" class="btn btn-prev" onclick="go(3)">Atrás</button>
                    <button type="button" class="btn btn-next" onclick="go(5)">Siguiente</button>
                </div>
            </div>

            <div class="step" id="step5">
                <label>¿Con cuántas personas se hizo el trabajo?</label>
                <select id="personas">
                    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                    <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                    <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                    <option value="10">10</option>
                </select>
                <label>¿Cuántas horas demoró?</label>
                <select id="horas">
                    <option value="1hr">1hr</option><option value="2hrs">2hrs</option><option value="3hrs">3hrs</option>
                    <option value="4hrs">4hrs</option><option value="5hrs">5hrs</option><option value="6hrs">6hrs</option>
                    <option value="7hrs">7hrs</option><option value="8hrs">8hrs</option><option value="9hrs">9hrs</option>
                    <option value="10hrs">10hrs</option><option value="11hrs">11hrs</option><option value="12hrs">12hrs</option>
                </select>
                <div class="btn-group">
                    <button type="button" class="btn btn-prev" onclick="go(4)">Atrás</button>
                    <button type="button" class="btn btn-next" onclick="go(6)">Siguiente</button>
                </div>
            </div>

            <div class="step" id="step6">
                <label>¿Terminaste el trabajo?</label>
                <select id="terminado">
                    <option value="Si">Si</option>
                    <option value="No">No</option>
                    <option value="En curso">En curso</option>
                </select>
                
                <label>Foto Housekeeping</label>
                <input type="file" id="fotoHK" accept="image/*" capture="environment" class="file-box">

                <label>Foto ART</label>
                <input type="file" id="fotoART" accept="image/*" capture="environment" class="file-box">

                <div class="btn-group">
                    <button type="button" class="btn btn-prev" onclick="go(5)">Atrás</button>
                </div>
                <button type="submit" id="btnS" class="btn btn-submit">ENVIAR REPORTE FINAL</button>
                <div id="loader" class="loader">Enviando a Excel...</div>
            </div>
        </form>
    </div>
</div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbytUEWdpzuWAJF9IBa_K9c9W7Qrgk6-7m4AnXoYiCMmpXV8C0GDFrTsOPj1CwI5kUSzJg/exec";

    function go(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
        window.scrollTo(0,0);
    }

    async function toB64(file) {
        return new Promise((res) => {
            if (!file) return res("");
            const r = new FileReader();
            r.onload = () => res(r.result);
            r.readAsDataURL(file);
        });
    }

    document.getElementById('mainForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnS');
        const loader = document.getElementById('loader');
        btn.disabled = true;
        loader.style.display = 'block';

        const payload = {
            nombre: document.getElementById('nombre').value,
            ot: document.getElementById('ot').value,
            cargo: document.getElementById('cargo').value,
            empresa: document.getElementById('empresa').value,
            equipo: document.getElementById('equipo').value,
            ocupoRepuestos: document.getElementById('ocupoRep').value,
            queRepuestos: document.getElementById('queRep').value,
            nPersonas: document.getElementById('personas').value,
            horas: document.getElementById('horas').value,
            terminado: document.getElementById('terminado').value,
            fotoHousekeeping: await toB64(document.getElementById('fotoHK').files[0]),
            fotoART: await toB64(document.getElementById('fotoART').files[0])
        };

        fetch(URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
        .then(() => {
            alert("Reporte enviado correctamente.");
            location.reload();
        }).catch(() => {
            alert("Error al enviar.");
            btn.disabled = false;
            loader.style.display = 'none';
        });
    });
</script>
</body>
</html>
