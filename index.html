<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Técnico - Codelco</title>
    <style>
        :root { --blue: #002855; --copper: #E05206; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .header { background: var(--blue); color: white; padding: 15px; text-align: center; border-radius: 8px 8px 0 0; }
        .container { max-width: 550px; margin: 0 auto; background: white; padding: 20px; border-radius: 0 0 8px 8px; border-top: 5px solid var(--copper); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .section-title { color: var(--blue); border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: 25px; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; }
        label { display: block; margin: 15px 0 5px; font-weight: 600; font-size: 0.85rem; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1rem; }
        .file-box { background: #f9f9f9; border: 1px dashed var(--blue); padding: 10px; border-radius: 5px; }
        .btn { background: var(--blue); color: white; border: none; padding: 18px; width: 100%; border-radius: 5px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 30px; }
        .btn:disabled { background: #ccc; }
        .loader { display: none; text-align: center; color: var(--copper); font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="header">
    <h3 style="margin:0;">GESTIÓN DE MANTENIMIENTO</h3>
    <p style="margin:5px 0 0; font-size: 0.75rem; opacity: 0.9;">REPORTE TÉCNICO OFICIAL</p>
</div>

<div class="container">
    <form id="otForm">
        <div class="section-title">1. Identificación</div>
        <label>Nombre del Responsable *</label>
        <input type="text" id="nombre" required placeholder="Nombre y Apellido">

        <label>N° Orden de Trabajo (OT)</label>
        <input type="text" id="ot" placeholder="Opcional">

        <label>Empresa</label>
        <select id="empresa">
            <option value="">Seleccione...</option>
            <option value="Codelco">Codelco</option>
            <option value="Metso">Metso</option>
            <option value="SFK">SFK</option>
            <option value="Nexxo">Nexxo</option>
            <option value="Schwager">Schwager</option>
            <option value="Cimap">Cimap</option>
        </select>

        <label>¿En qué equipo trabajaste?</label>
        <select id="equipo">
            <option value="">Seleccione equipo...</option>
            <optgroup label="Harnischfeger / F900">
                <option value="Harn15/F900-1">Harn15/F900-1</option>
                <option value="Harn25/F900-1">Harn25/F900-1</option>
                <option value="F900-3">F900-3</option>
                <option value="F900-3A">F900-3A</option>
                <option value="Harn45/F900-4">Harn45/F900-4</option>
                <option value="Harn5S/F900-5">Harn5S/F900-5</option>
            </optgroup>
            <optgroup label="F600 Serie A">
                <option value="HarnF600 1A">HarnF600 1A</option>
                <option value="HarnF600 2A">HarnF600 2A</option>
                <option value="HarnF600 3A">HarnF600 3A</option>
                <option value="HarnF600 4A">HarnF600 4A</option>
                <option value="HarnF600 5A">HarnF600 5A</option>
                <option value="HarnF600 6A">HarnF600 6A</option>
                <option value="HarnF600 7A">HarnF600 7A</option>
                <option value="HarnF600 8A">HarnF600 8A</option>
                <option value="HarnF600 9A">HarnF600 9A</option>
                <option value="HarnF600 10A">HarnF600 10A</option>
            </optgroup>
            <optgroup label="F600 Serie B">
                <option value="HarnF600 3B">HarnF600 3B</option>
                <option value="HarnF600 4B">HarnF600 4B</option>
                <option value="HarnF600 5B">HarnF600 5B</option>
                <option value="HarnF600 6B">HarnF600 6B</option>
                <option value="HarnF600 7B">HarnF600 7B</option>
                <option value="HarnF600 8B">HarnF600 8B</option>
                <option value="HarnF600 9B">HarnF600 9B</option>
                <option value="HarnF600 10B">HarnF600 10B</option>
            </optgroup>
            <optgroup label="Chancadores">
                <option value="ChaS1">ChaS1</option><option value="ChaS2">ChaS2</option>
                <option value="ChaS3">ChaS3</option><option value="ChaS4">ChaS4</option>
                <option value="ChaS5">ChaS5</option><option value="ChaT1">ChaT1</option>
                <option value="ChaT2">ChaT2</option><option value="ChaT3">ChaT3</option>
                <option value="ChaT4">ChaT4</option><option value="ChaT5">ChaT5</option>
                <option value="ChaT6">ChaT6</option><option value="ChaT7">ChaT7</option>
                <option value="ChaT8">ChaT8</option><option value="ChaT9">ChaT9</option>
                <option value="ChaT10">ChaT10</option>
            </optgroup>
            <optgroup label="Nodos y Correas">
                <option value="NODO 1">NODO 1</option><option value="NODO 2">NODO 2</option><option value="NODO 3">NODO 3</option>
                <option value="C/135A">C/135A</option><option value="C/1A">C/1A</option><option value="C/2A">C/2A</option>
                <option value="C/11A">C/11A</option><option value="C/22A">C/22A</option><option value="C/140A">C/140A</option>
                <option value="C/141A">C/141A</option><option value="C/140">C/140</option><option value="C/141">C/141</option>
                <option value="C/142">C/142</option><option value="C/136A">C/136A</option><option value="C/136B">C/136B</option>
                <option value="C/136C">C/136C</option><option value="C/144">C/144</option><option value="C/137A">C/137A</option>
                <option value="C/137">C/137</option><option value="C/135B">C/135B</option><option value="C/135C">C/135C</option>
                <option value="C/135D">C/135D</option><option value="C/136">C/136</option><option value="C/138">C/138</option>
                <option value="C/139">C/139</option><option value="C/143">C/143</option><option value="C/135E">C/135E</option>
                <option value="C/134A">C/134A</option><option value="C/134B">C/134B</option><option value="C/134C">C/134C</option>
                <option value="C/134D">C/134D</option><option value="C/134E">C/134E</option>
            </optgroup>
            <option value="Fabricación/Reparación estructuras">Fabricación/Reparación estructuras</option>
            <option value="Housekeeping">Housekeeping</option>
        </select>

        <div class="section-title">2. Detalles de Ejecución</div>
        <label>Dotación (¿Con cuántas personas trabajó?)</label>
        <select id="nPersonas">
            <option value="">Seleccione cantidad...</option>
            <option value="1 persona">1 persona</option>
            <option value="2 personas">2 personas</option>
            <option value="3 personas">3 personas</option>
            <option value="4 personas">4 personas</option>
            <option value="5 personas">5 personas</option>
            <option value="6 personas">6 personas</option>
            <option value="7 personas">7 personas</option>
            <option value="8 personas">8 personas</option>
            <option value="9 personas">9 personas</option>
            <option value="10 personas">10 personas</option>
        </select>

        <label>¿Cuántas horas demoró?</label>
        <select id="horas">
            <option value="">Seleccione horas...</option>
            <option value="1 hr">1 hr</option><option value="2 hrs">2 hrs</option>
            <option value="3 hrs">3 hrs</option><option value="4 hrs">4 hrs</option>
            <option value="5 hrs">5 hrs</option><option value="6 hrs">6 hrs</option>
            <option value="7 hrs">7 hrs</option><option value="8 hrs">8 hrs</option>
            <option value="9 hrs">9 hrs</option><option value="10 hrs">10 hrs</option>
            <option value="11 hrs">11 hrs</option><option value="12 hrs">12 hrs</option>
        </select>

        <label>¿Terminaste el trabajo?</label>
        <select id="terminado">
            <option value="">Seleccione estado...</option>
            <option value="Si">Si</option>
            <option value="No">No</option>
            <option value="En curso">En curso</option>
        </select>

        <div class="section-title">3. Evidencia Fotográfica</div>
        <label>Foto Housekeeping</label>
        <input type="file" id="fotoHousekeeping" accept="image/*" capture="environment" class="file-box">

        <label>Foto ART</label>
        <input type="file" id="fotoART" accept="image/*" capture="environment" class="file-box">

        <button type="submit" id="btn" class="btn">ENVIAR REPORTE</button>
        <div id="loading" class="loader">Sincronizando datos y fotos... No cierre la página.</div>
    </form>
</div>

<script>
    // PEGA AQUÍ TU ÚLTIMA URL DE APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2KNZ9MWt5Y4c12LDWQQEGsNDI6xpcISFu7RG8iC8yRQdLIhtejel20MXq_ArsjK329Q/exec";

    async function toB64(file) {
        return new Promise((res) => {
            if (!file) return res("");
            const r = new FileReader();
            r.onload = () => res(r.result);
            r.readAsDataURL(file);
        });
    }

    document.getElementById('otForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn');
        const loader = document.getElementById('loading');
        
        btn.disabled = true;
        btn.innerText = "ENVIANDO...";
        loader.style.display = 'block';

        const payload = {
            nombre: document.getElementById('nombre').value,
            ot: document.getElementById('ot').value,
            empresa: document.getElementById('empresa').value,
            equipo: document.getElementById('equipo').value,
            nPersonas: document.getElementById('nPersonas').value,
            horas: document.getElementById('horas').value,
            terminado: document.getElementById('terminado').value,
            fotoHousekeeping: await toB64(document.getElementById('fotoHousekeeping').files[0]),
            fotoART: await toB64(document.getElementById('fotoART').files[0])
        };

        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
        .then(() => {
            alert("¡Reporte enviado con éxito!");
            location.reload();
        }).catch(() => {
            alert("Error al enviar. Intente de nuevo.");
            btn.disabled = false;
            btn.innerText = "ENVIAR REPORTE";
            loader.style.display = 'none';
        });
    });
</script>
</body>
</html>
